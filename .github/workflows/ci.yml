name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  flutter:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  rules-typecheck:
    name: Rules-tests TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rules-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: rules-tests/package-lock.json
      - run: npm ci || npm install
      - run: npm run build
      # Full emulator suite is local-only (requires Firebase emulator + Java).
      # See rules-tests/README.md.
